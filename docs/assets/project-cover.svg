<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">空压机售后智能服务系统</title>
  <desc id="desc">将售后需求组织为可确认、可恢复、可核验的业务流程。图示为需求、状态、工具和回执的架构关系。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d302f"/><stop offset="1" stop-color="#122635"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#34504f" stroke-width=".6"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect x="710" width="570" height="360" rx="20" fill="url(#grid)" opacity=".5"/>
  <g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <rect x="46" y="40" width="28" height="3" rx="1.5" fill="#69d5b9"/>
    <text x="86" y="47" fill="#88ada9" font-size="13" letter-spacing="3">INDUSTRIAL SERVICE · AGENT WORKFLOW</text>
    <text x="46" y="122" fill="#f3faf8" font-size="55" font-weight="700">空压机售后</text>
    <text x="46" y="187" fill="#f3faf8" font-size="55" font-weight="700">智能服务系统</text>
    <text x="48" y="228" fill="#b1cac8" font-size="18">将售后需求组织为可确认、可恢复、可核验的业务流程</text>
    <g font-size="14" fill="#92dfca">
      <rect x="46" y="271" width="114" height="34" rx="17" fill="#1b4841"/><text x="66" y="293">受控报修</text>
      <rect x="174" y="271" width="114" height="34" rx="17" fill="#1b4841"/><text x="194" y="293">企业隔离</text>
      <rect x="302" y="271" width="142" height="34" rx="17" fill="#1b4841"/><text x="322" y="293">状态持久化</text>
      <rect x="458" y="271" width="142" height="34" rx="17" fill="#1b4841"/><text x="478" y="293">上下文预算</text>
    </g>
    <rect x="758" y="61" width="466" height="241" rx="14" fill="#132e35" stroke="#355553"/>
    <text x="786" y="94" fill="#6dcdb5" font-size="12" letter-spacing="2">CONTROLLED EXECUTION</text>
    <g fill="none" stroke="#658d88" stroke-width="2"><path d="M915 151H1040"/><path d="M1100 185V215"/><path d="M1040 248H915"/></g>
    <g font-size="18" text-anchor="middle">
      <rect x="786" y="120" width="129" height="65" rx="9" fill="#1b4841" stroke="#47766b"/><text x="850" y="149" fill="#d7f4eb">需求与身份</text><text x="850" y="169" font-size="11" fill="#91b7ac">TRUSTED INPUT</text>
      <rect x="1040" y="120" width="156" height="65" rx="9" fill="#1d3c4b" stroke="#49677d"/><text x="1118" y="149" fill="#dbeaf4">澄清与确认</text><text x="1118" y="169" font-size="11" fill="#9eb9cb">WORKFLOW STATE</text>
      <rect x="1040" y="215" width="156" height="65" rx="9" fill="#1d3c4b" stroke="#49677d"/><text x="1118" y="244" fill="#dbeaf4">领域工具</text><text x="1118" y="264" font-size="11" fill="#9eb9cb">GUARDED WRITE</text>
      <rect x="786" y="215" width="129" height="65" rx="9" fill="#1b4841" stroke="#47766b"/><text x="850" y="244" fill="#d7f4eb">状态与回执</text><text x="850" y="264" font-size="11" fill="#91b7ac">PERSISTENCE</text>
    </g>
  </g>
