name: Verify web deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and boot actual deployment stack
        run: |
          printf 'ACS_POSTGRES_PASSWORD=ci-only-web-password\nACS_WEB_ORIGIN=http://127.0.0.1:8080\nACS_WEB_BIND=127.0.0.1:8080\nACS_ADMIN_PASSWORD=ci-only-admin-password-long-enough\nACS_CHANNEL_KEY=abababababababababababababababababababababababababababababababab\n' > .env
          docker compose --env-file .env -f deploy/compose.yaml up -d --build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:8080/healthz
      - name: Export and verify offline installation from saved images
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p .cache/release
          docker save compressor-service-web:local postgres:17 | gzip -6 > .cache/release/acs-web-linux-amd64.tar.gz
          docker save compressor-service-web:local | gzip -6 > .cache/release/acs-web-update-linux-amd64.tar.gz
          docker image inspect --format '{{.RepoTags}} {{.Os}}/{{.Architecture}} {{.Id}}' compressor-service-web:local postgres:17 > .cache/release/images.txt
          printf 'Source repository: %s\nSource commit: %s\nBuild run: %s/actions/runs/%s\nSources and licenses: Dockerfile, LICENSE, NOTICE.md and upstream image distributions.\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> .cache/release/images.txt
          (cd .cache/release && sha256sum acs-web-linux-amd64.tar.gz > SHA256SUMS)
          (cd .cache/release && sha256sum acs-web-update-linux-amd64.tar.gz > SHA256SUMS-update)
          docker compose --env-file .env -f deploy/compose.yaml down
          docker image rm compressor-service-web:local postgres:17
          (cd .cache/release && sha256sum --check SHA256SUMS)
          bash scripts/deploy-web.sh .cache/release/acs-web-linux-amd64.tar.gz
          curl --fail http://127.0.0.1:8080/healthz
          docker compose --env-file .env -f deploy/compose.yaml stop web
          docker compose --env-file .env -f deploy/compose.yaml rm -f web
          docker image rm compressor-service-web:local
          bash scripts/deploy-web.sh .cache/release/acs-web-update-linux-amd64.tar.gz
          curl --fail http://127.0.0.1:8080/healthz
      - name: Desktop and mobile against PostgreSQL API
        env:
          ACS_ADMIN_TEST_PASSWORD: ci-only-admin-password-long-enough
        run: npx playwright test --config apps/service-console/playwright.live.config.ts
      - name: Verify persisted visitor and ticket after container restart
        run: ACS_RESTART_TEST=1 node scripts/verify-web-restart.mjs
      - name: Check pinned SDK inside constrained Web container
        run: docker compose --env-file .env -f deploy/compose.yaml exec -T web python -c "import resource,lark_oapi; print('Official Feishu SDK imported; peak RSS KiB:',resource.getrusage(resource.RUSAGE_SELF).ru_maxrss)"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: offline-linux-amd64
          path: .cache/release/
          include-hidden-files: true
          compression-level: 0
      - name: Diagnostics
        if: failure()
        run: docker compose --env-file .env -f deploy/compose.yaml logs --tail 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-results
          path: apps/service-console/test-results/
      - name: Stop containers
        if: always()
        run: docker compose --env-file .env -f deploy/compose.yaml down
  publish-offline:
    if: github.event_name == 'workflow_dispatch'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offline-linux-amd64
          path: release
      - name: Publish the validated deployment bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="web-offline-${GITHUB_SHA:0:12}"
          printf 'Linux amd64 离线部署包，源码版本 %s。\n\n首页为管理员工作台，支持飞书接入配置与企业绑定。默认业务规则，真实飞书收发需要应用凭证及平台配置。\n\n完整包包含本项目 Web 镜像与 Docker 官方 PostgreSQL 17 镜像；update 包仅包含 Web，适合已安装 postgres:17 的服务器。分别下载 SHA256SUMS 或 SHA256SUMS-update，与对应包放在同一目录，再从更新后的仓库运行 sudo bash scripts/deploy-web.sh <包文件路径>。已验证禁止联网拉取/构建的完整导入、Web 单独升级、桌面/手机流程与重启恢复。许可和来源保留在源码及镜像中。\n' "$GITHUB_SHA" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/acs-web-linux-amd64.tar.gz release/SHA256SUMS release/acs-web-update-linux-amd64.tar.gz release/SHA256SUMS-update release/images.txt --clobber
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title '售后管理台与飞书 Linux 离线部署包' --prerelease --notes-file notes.md release/acs-web-linux-amd64.tar.gz release/SHA256SUMS release/acs-web-update-linux-amd64.tar.gz release/SHA256SUMS-update release/images.txt
          fi
