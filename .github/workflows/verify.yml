name: Verify service workflow
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python evals/run_service_eval.py --output evals/reports/service.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/miniclaw/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm ci
        working-directory: vendor/miniclaw
      - run: npm ci
        working-directory: vendor/miniclaw/container/agent-runner
      - run: npm run build
        working-directory: vendor/miniclaw/container/agent-runner
      - run: npm test -- --run tests/acs-service-bridge.test.ts
        working-directory: vendor/miniclaw
      - uses: actions/upload-artifact@v4
        with:
          name: offline-service-benchmark
          path: evals/reports/service.json
