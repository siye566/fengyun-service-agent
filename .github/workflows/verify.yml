name: Verify service workflow
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: acs_test
          POSTGRES_USER: acs_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acs_test -d acs_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ACS_DATABASE_URL: postgresql://acs_test:ci-only-password@127.0.0.1:5432/acs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python evals/run_service_eval.py --output evals/reports/service.json
      - run: python examples/demo_service.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/miniclaw/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm ci
        working-directory: vendor/miniclaw
      - run: npm ci
        working-directory: vendor/miniclaw/container/agent-runner
      - run: npm run build
        working-directory: vendor/miniclaw/container/agent-runner
      - run: npm test -- --run tests/acs-service-bridge.test.ts
        working-directory: vendor/miniclaw
      - uses: actions/upload-artifact@v4
        with:
          name: offline-service-benchmark
          path: evals/reports/service.json
