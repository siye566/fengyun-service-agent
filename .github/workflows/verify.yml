name: Verify service workflow
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q
        working-directory: acs-agent
      - run: python evals/run_service_eval.py --output evals/reports/service.json
        working-directory: acs-agent
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniclaw/package-lock.json
      - run: npm ci
        working-directory: miniclaw
      - run: npm ci
        working-directory: miniclaw/container/agent-runner
      - run: npm run build
        working-directory: miniclaw/container/agent-runner
      - run: npm test -- --run tests/acs-service-bridge.test.ts
        working-directory: miniclaw
      - uses: actions/upload-artifact@v4
        with:
          name: offline-service-benchmark
          path: acs-agent/evals/reports/service.json
